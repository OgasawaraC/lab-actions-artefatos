name: Pipeline Inteligente

on:
  workflow_dispatch:

  schedule:
    - cron: '0 2 * * *'

  push:
    branches:
      - 'feature/**'
    paths:
      - 'src/**'
      - '!src/docs/**'

jobs:
  job_gerador:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p saida_build
          echo "Relatório 1 gerado com sucesso" > saida_build/relatorio1.txt
          echo "Relatório 2 gerado com sucesso" > saida_build/relatorio2.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: meus-relatorios-oficiais
          path: saida_build/

  job_auditoria:
    runs-on: ubuntu-latest
    needs: [job_gerador]

    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          name: meus-relatorios-oficiais

      - name: Verificar arquivos
        run: |
          ls -R
          cat relatorio1.txt